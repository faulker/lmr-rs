name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  # Figure the release tag only. Do not commit or tag yet: a failed build
  # must leave main untouched. The build job stamps this version into
  # Cargo.toml via sed so the binary still embeds the right version.
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: bump
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump }}
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi

          VERSION="${LATEST_TAG#v}"
          # Strip any pre-release or build metadata (e.g. 1.2.3-alpha.1+build)
          VERSION="${VERSION%%-*}"
          VERSION="${VERSION%%+*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR="${MAJOR:-0}"; MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"

          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists; refuse to reuse it"
            exit 1
          fi
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Bumping $LATEST_TAG -> $NEW_TAG ($BUMP_TYPE)"

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: [resolve-version]
    if: always() && (needs.resolve-version.result == 'success' || needs.resolve-version.result == 'skipped')
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.new_tag || github.ref_name }}
      # Apple signing inputs. Lifted into env so the macOS-only steps can test
      # for them in `if:` conditions; when they're unset the build still runs and
      # simply ships unsigned binaries, so forks and first-time runs work.
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64 (Apple Silicon)
            runner: macos-latest
            target: aarch64-apple-darwin
            features: metal
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: ""
          # candle/gemm emits NEON fp16 kernels; rustc will not assemble them
          # unless FEAT_FP16 is on. .cargo/config.toml sets that for this target.
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: ""
    steps:
      # Checkout the triggering commit, not RELEASE_TAG: on workflow_dispatch the
      # tag is only created after a successful build. Version is stamped below.
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.features }}-v2

      # Stamp the release version into Cargo.toml before building so
      # CARGO_PKG_VERSION matches the tag. Do not commit here: the release
      # job persists the bump only after every target builds successfully.
      #
      # Use a portable in-place sed. BSD sed (macOS) does not honor GNU's
      # `0,/pattern/` range, which previously left macOS binaries on the
      # previous version while Linux stamped correctly.
      - name: Set version in Cargo.toml
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$RELEASE_TAG" ]; then
            echo "RELEASE_TAG must look like vX.Y.Z, got: ${RELEASE_TAG:-<empty>}"
            exit 1
          fi
          sed -i.bak 's/^version = ".*"/version = "'"${VERSION}"'"/' Cargo.toml
          rm -f Cargo.toml.bak
          STAMPED="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$STAMPED" != "$VERSION" ]; then
            echo "Failed to stamp Cargo.toml: wanted ${VERSION}, got ${STAMPED}"
            exit 1
          fi
          echo "Building ${RELEASE_TAG} (Cargo.toml version=${STAMPED})"

      # macOS ships with `--features metal` so `device = "auto"` can use the GPU.
      # Linux releases are CPU-only; CUDA needs a local toolkit the runners lack.
      - name: Run tests
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          if [ -n "$FEATURES" ]; then
            cargo test --target ${{ matrix.target }} --features "$FEATURES"
          else
            cargo test --target ${{ matrix.target }}
          fi

      - name: Build release binary
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          if [ -n "$FEATURES" ]; then
            cargo build --release --target ${{ matrix.target }} --features "$FEATURES"
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      # Catch a silent stamp failure before packaging/signing: clap's
      # `version` flag reads CARGO_PKG_VERSION from the binary.
      - name: Verify embedded version
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          BIN="target/${{ matrix.target }}/release/laya-rs"
          REPORTED="$("$BIN" --version)"
          echo "Binary reports: ${REPORTED}"
          if [ "$REPORTED" != "laya-rs ${VERSION}" ]; then
            echo "Binary version mismatch: expected 'laya-rs ${VERSION}', got '${REPORTED}'"
            exit 1
          fi

      # Signing happens between build and packaging, so the archive (and the
      # checksums computed from it in the release job) covers the signed binary.
      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          # A throwaway keychain, unlocked for this job only, keeps the key out of
          # the runner's login keychain and makes cleanup a single delete.
          KEYCHAIN="$RUNNER_TEMP/codesign.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          CERT="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT"
          security import "$CERT" \
            -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -f pkcs12
          rm -f "$CERT"
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Put it at the front of the search list, keeping the existing entries,
          # so certificate chains still resolve for anything else in the job.
          EXISTING=()
          while IFS= read -r line; do
            entry="$(printf '%s' "$line" | tr -d '"' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -n "$entry" ] && EXISTING+=("$entry")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign binary
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/laya-rs"
          # Hardened runtime and a secure timestamp are both required for the
          # signature to be accepted by notarization.
          codesign --force \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN" \
            --options runtime \
            --timestamp \
            "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

      # Signing alone still leaves Gatekeeper unhappy about a binary downloaded
      # through a browser; notarization is what clears that. `notarytool` only
      # takes zip/pkg/dmg, so the binary is zipped just for submission. A bare
      # executable can't have the ticket stapled to it, so nothing is copied
      # back: Gatekeeper looks the ticket up online by the signature's hash.
      - name: Notarize binary
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != '' && env.APPLE_NOTARY_KEY != ''
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/notary.p8"
          printf '%s' "$APPLE_NOTARY_KEY" | base64 --decode > "$KEY"
          ZIP="$RUNNER_TEMP/laya-rs-notarize.zip"
          # No --keepParent: the source is a single executable, not a bundle.
          ditto -c -k "target/${{ matrix.target }}/release/laya-rs" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --key "$KEY" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait \
            --timeout 30m
          rm -f "$KEY" "$ZIP"

      - name: Report signing status
        if: runner.os == 'macOS'
        run: |
          if [ -n "${APPLE_CERTIFICATE_P12:-}" ]; then
            codesign --display --verbose=2 "target/${{ matrix.target }}/release/laya-rs" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "APPLE_CERTIFICATE_P12 is not set: ${{ matrix.target }} is unsigned." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf "laya-rs-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" laya-rs
          mv "laya-rs-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" "$GITHUB_WORKSPACE/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: laya-rs-${{ matrix.target }}
          path: laya-rs-${{ env.RELEASE_TAG }}-${{ matrix.target }}.tar.gz

      # Runs even when an earlier step failed, so a signing key never outlives
      # the job that used it.
      - name: Remove signing keychain
        if: always() && runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != ''
        run: security delete-keychain "$KEYCHAIN" || true

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [resolve-version, build]
    if: always() && needs.build.result == 'success'
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.new_tag || github.ref_name }}
    steps:
      # On workflow_dispatch only: persist the version that the build already
      # embedded, then tag that commit. Tag-push releases skip this; the tag
      # already points at the intended commit.
      - name: Checkout release commit
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        if: github.event_name == 'workflow_dispatch'
        uses: dtolnay/rust-toolchain@stable

      - name: Commit version bump and push tag
        if: github.event_name == 'workflow_dispatch'
        env:
          NEW_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          VERSION="${NEW_TAG#v}"
          # Same portable stamp as the build job (GNU sed on ubuntu, but
          # keep one pattern so the two sites cannot drift apart again).
          sed -i.bak 's/^version = ".*"/version = "'"${VERSION}"'"/' Cargo.toml
          rm -f Cargo.toml.bak
          STAMPED="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$STAMPED" != "$VERSION" ]; then
            echo "Failed to stamp Cargo.toml: wanted ${VERSION}, got ${STAMPED}"
            exit 1
          fi
          cargo generate-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if git diff --staged --quiet; then
            echo "Cargo.toml already at ${VERSION}; tagging current commit"
          else
            git commit -m "chore: bump version to ${VERSION}"
          fi
          # Fast-forward only: if main moved during the build, fail rather than
          # force-push or release from a divergent history.
          git push origin HEAD:main
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG already exists, refusing to move it"
            exit 1
          fi
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          shasum -a 256 -- * > checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            artifacts/*
